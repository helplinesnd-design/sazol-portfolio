<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="মো সজল মিয়ান — অফিস সহকারী কাম কম্পিউটার মুদ্রাক্ষরিক, বিক্রয় ও বিতরণ বিভাগ-কালুরঘাট, বিদ্যুৎ উন্নয়ন বোর্ড, চট্টগ্রাম।">
<title>মো সজল মিয়ান | পেশাগত পোর্টফোলিও</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060f1e;
  --surface: rgba(16, 33, 58, 0.72);
  --surface-solid: #10213a;
  --surface2: rgba(25, 49, 84, 0.8);
  --text: #f0f6fc;
  --muted: #9eb3c9;
  --accent: #38d9c9;
  --accent-glow: rgba(56, 217, 201, 0.35);
  --gold: #f5c25b;
  --line: rgba(255, 255, 255, 0.1);
  --shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Hind Siliguri", system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(20, 68, 115, 0.45) 0%, transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(56, 217, 201, 0.12) 0%, transparent 45%),
    radial-gradient(circle at 50% 85%, rgba(18, 52, 90, 0.4) 0%, transparent 50%);
  color: var(--text);
  line-height: 1.75;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
.container { width: min(1140px, 92%); margin: auto; }

/* Navigation */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 15, 30, 0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  transition: all 0.3s ease;
}
.navinner {
  height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand {
  font-weight: 700;
  letter-spacing: 0.5px;
  font-size: 21px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand span { color: var(--accent); }
.navlinks {
  display: flex;
  gap: 28px;
  color: var(--muted);
  font-size: 16px;
  font-weight: 500;
}
.navlinks a {
  position: relative;
  padding: 4px 0;
  transition: color 0.25s;
}
.navlinks a::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--accent);
  transition: width 0.3s ease;
}
.navlinks a:hover { color: var(--accent); }
.navlinks a:hover::after { width: 100%; }

.menu {
  display: none;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 18px;
}

/* Hero Section */
.hero {
  padding: 90px 0 75px;
  display: grid;
  grid-template-columns: 1.25fr 0.85fr;
  gap: 50px;
  align-items: center;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--accent);
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  background: rgba(56, 217, 201, 0.1);
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(56, 217, 201, 0.25);
}
h1 {
  font-size: clamp(36px, 4.6vw, 56px);
  line-height: 1.22;
  margin: 20px 0 16px;
  font-weight: 700;
}
h1 .accent {
  background: linear-gradient(120deg, var(--accent), #6ee7b7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.typing-wrap {
  font-size: 20px;
  font-weight: 600;
  color: var(--gold);
  margin-bottom: 16px;
  min-height: 34px;
}
.cursor {
  display: inline-block;
  width: 2px;
  background-color: var(--accent);
  animation: blink 0.8s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.lead {
  font-size: 17.5px;
  color: var(--muted);
  max-width: 640px;
  margin-bottom: 30px;
}
.actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 26px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 16px;
  border: 1px solid var(--line);
  transition: all 0.25s ease;
  cursor: pointer;
}
.btn.primary {
  background: linear-gradient(135deg, var(--accent), #25b3a5);
  color: #041c24;
  border-color: transparent;
  box-shadow: 0 8px 25px rgba(56, 217, 201, 0.28);
}
.btn.primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(56, 217, 201, 0.45);
}
.btn.secondary {
  background: var(--surface);
  backdrop-filter: blur(10px);
}
.btn.secondary:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
}

/* Profile Card */
.profilecard {
  position: relative;
  background: linear-gradient(160deg, rgba(23, 52, 82, 0.85), rgba(11, 24, 44, 0.95));
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  padding: 34px 28px;
  border-radius: 28px;
  box-shadow: var(--shadow);
  text-align: center;
  overflow: hidden;
  transition: transform 0.3s ease;
}
.profilecard:hover { transform: translateY(-5px); }
.profilecard::before {
  content: "";
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56, 217, 201, 0.2), transparent 70%);
  top: -60px;
  right: -60px;
}

.avatar-wrap {
  position: relative;
  width: 148px;
  height: 148px;
  border-radius: 50%;
  padding: 4px;
  background: linear-gradient(135deg, var(--accent), var(--gold), #267ca3);
  margin: 0 auto 20px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
}
.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 15%;
  display: block;
  background: #142944;
  border: 3px solid #0b182c;
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(56, 217, 201, 0.15);
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
  margin-bottom: 10px;
  border: 1px solid rgba(56, 217, 201, 0.3);
}
.status-dot {
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent);
}
.profilecard h3 { margin: 0; font-size: 25px; font-weight: 700; }
.profilecard p {
  color: var(--muted);
  margin: 8px 0 18px;
  font-size: 15px;
  line-height: 1.55;
}

/* Social Links */
.sociallinks {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 20px;
}
.socialbtn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  transition: all 0.25s ease;
}
.socialbtn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}
.socialbtn.fb:hover {
  border-color: #1877F2;
  color: #60a5fa;
  background: rgba(24, 119, 242, 0.15);
  transform: translateY(-2px);
}
.socialbtn.ig:hover {
  border-color: #E1306C;
  color: #f472b6;
  background: rgba(225, 48, 108, 0.15);
  transform: translateY(-2px);
}

.statrow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  text-align: left;
}
.stat {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.07);
  padding: 13px 15px;
  border-radius: 14px;
}
.stat strong {
  display: block;
  color: var(--gold);
  font-size: 17px;
}
.stat small { color: var(--muted); font-size: 13px; }

/* Sections */
section { padding: 75px 0; }
.sectionhead { margin-bottom: 38px; }
.sectionhead .eyebrow { margin-bottom: 12px; }
h2 {
  font-size: clamp(28px, 3.2vw, 40px);
  line-height: 1.25;
  margin: 0 0 10px;
  font-weight: 700;
}
.sectionhead p { color: var(--muted); max-width: 680px; margin: 0; font-size: 16.5px; }

/* Grids & Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.card {
  background: var(--surface);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 26px;
  transition: all 0.3s ease;
}
.card:hover {
  transform: translateY(-6px);
  border-color: rgba(56, 217, 201, 0.5);
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
}
.icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(56, 217, 201, 0.18), rgba(56, 217, 201, 0.05));
  border: 1px solid rgba(56, 217, 201, 0.25);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 22px;
  margin-bottom: 18px;
}
.card h3 { margin: 0 0 10px; font-size: 20px; font-weight: 600; }
.card p { color: var(--muted); margin: 0; font-size: 15.5px; }

/* About Section */
.aboutgrid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 26px;
}
.aboutbox {
  background: var(--surface);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  padding: 30px;
  border-radius: 22px;
}
.aboutbox h3 { margin-top: 0; font-size: 21px; color: var(--accent); }
.aboutbox p { color: var(--muted); margin-top: 0; font-size: 16px; }
.aboutbox p:last-child { margin-bottom: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; }
.tag {
  padding: 8px 15px;
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: #d6e4f2;
  font-size: 14px;
  transition: all 0.2s;
}
.tag:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
}

/* Timeline */
.timeline {
  border-left: 2px solid rgba(56, 217, 201, 0.35);
  margin-left: 10px;
  padding-left: 28px;
  display: grid;
  gap: 22px;
}
.timelineitem {
  position: relative;
  background: var(--surface);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  padding: 25px;
  border-radius: 20px;
  transition: border-color 0.3s;
}
.timelineitem:hover { border-color: rgba(56, 217, 201, 0.45); }
.timelineitem::before {
  content: "";
  position: absolute;
  left: -37px;
  top: 30px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 6px rgba(56, 217, 201, 0.15);
}
.timelineitem .date { color: var(--gold); font-size: 14px; font-weight: 700; }
.timelineitem h3 { margin: 6px 0
